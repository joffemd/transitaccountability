name: Deploy Optimized Site to Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Install build tools
        run: pnpm install --frozen-lockfile

      - name: Run optimizations
        run: pnpm build

      - name: Prepare deployment package
        run: |
          mkdir dist
          rsync -a --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='dist' --exclude='*.md' --exclude='package.json' --exclude='pnpm-*.yaml' --exclude='.gitignore' --exclude='*.diff' --exclude='site.js' --exclude='styles.css' ./ dist/
          mv dist/styles.min.css dist/styles.css
          mv dist/site.min.js dist/site.js
          touch dist/.nojekyll

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
